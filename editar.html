<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Evaluaciones — Gestión Hídrica</title>
  <style>
    :root{--primary:#EC6608;--bg:#f5f6fa;--card:#fff;--border:#dde1e7;--muted:#7f8c8d}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#2c3e50;padding-bottom:64px}
    header{background:var(--primary);color:#fff;padding:28px 40px;text-align:center}
    header h1{font-size:1.45rem;font-weight:700} header p{margin-top:6px;font-size:.9rem;opacity:.9}
    .top-nav{background:#000;padding:0 40px;display:flex;gap:4px}
    .top-nav a{color:rgba(255,255,255,.72);text-decoration:none;padding:10px 18px;font-size:.84rem;font-weight:600;border-bottom:3px solid transparent;transition:color .15s,border-color .15s}
    .top-nav a:hover,.top-nav a.active{color:#fff;border-bottom-color:#EC6608}
    .container{max-width:1100px;margin:0 auto;padding:24px 16px}
    .card{background:var(--card);border-radius:10px;padding:24px 28px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:24px}
    .card h2{font-size:1rem;color:var(--primary);margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--border)}
    #loading{text-align:center;padding:40px;color:var(--muted);display:none} #loading.visible{display:block}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #empty{text-align:center;padding:40px;color:var(--muted);display:none} #empty.visible{display:block}
    .eval-table{width:100%;border-collapse:collapse;display:none}
    .eval-table.visible{display:table}
    .eval-table th{background:#f0f2f5;padding:10px 12px;text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border)}
    .eval-table td{padding:12px;border-bottom:1px solid var(--border);font-size:.88rem}
    .eval-table tr:last-child td{border-bottom:none}
    .eval-table tbody tr:hover{background:#f8f9fa}
    .btn{padding:8px 16px;border-radius:6px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
    .btn-edit{background:#3498db;color:#fff} .btn-edit:hover{background:#2980b9}
    .btn-delete{background:#e74c3c;color:#fff;margin-left:6px} .btn-delete:hover{background:#c0392b}
    .nota-chip{display:inline-block;padding:3px 10px;border-radius:15px;font-weight:700;font-size:.85rem}
    .nota-hi{background:#d5f5e3;color:#1e8449} .nota-ok{background:#d6eaf8;color:#1a5276} .nota-mid{background:#fdfad3;color:#7d6608} .nota-low{background:#fdf2f2;color:#c0392b}
    .alert{padding:14px 18px;border-radius:8px;margin-bottom:20px;display:none}
    .alert.visible{display:block}
    .alert.success{background:#d5f5e3;border:1.5px solid#27ae60;color:#1e8449}
    .alert.error{background:#fdf2f2;border:1.5px solid #e74c3c;color:#c0392b}
  </style>
</head>
<body>
<header>
  <h1>Editar Evaluaciones — Gestión Hídrica</h1>
  <p>Administra y modifica evaluaciones existentes</p>
</header>
<nav class="top-nav">
  <a href="index.html">📋 Evaluar</a>
  <a href="resultados.html">🏆 Ver Resultados</a>
  <a href="editar.html" class="active">✏️ Editar Evaluaciones</a>
</nav>
<div class="container">
  <div id="alert-msg" class="alert"></div>
  <div id="loading"><div class="spinner"></div><p>Cargando evaluaciones...</p></div>
  <div id="empty"><p style="font-size:2.5rem;margin-bottom:12px">📝</p><p style="font-size:1.05rem;font-weight:600">No hay evaluaciones para editar</p></div>
  <div class="card">
    <h2>📊 Lista de Evaluaciones</h2>
    <table class="eval-table" id="eval-table">
      <thead><tr>
        <th style="width:50px">#</th>
        <th>Grupo</th>
        <th>Evaluador</th>
        <th>Fecha</th>
        <th style="width:85px;text-align:center">Nota Final</th>
        <th style="width:140px;text-align:center">Acciones</th>
      </tr></thead>
      <tbody id="eval-body"></tbody>
    </table>
  </div>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpdIOBht2G9En2vuX-SlfhE9AiMzwK7NSi0juK0sARnz-PL1da7Oqvl-SDQKCDU-Q/exec';
let evaluaciones=[];
function loadData() {
  if(APPS_SCRIPT_URL===''){showAlert('error','⚠️ Configura la URL del Apps Script.');return;}
  setLoading(true);
  const old=document.getElementById('jsonp-script'); if(old) old.remove();
  const script=document.createElement('script'); script.id='jsonp-script';
  script.src=APPS_SCRIPT_URL+'?callback=receiveData&t='+Date.now();
  script.onerror=function(){setLoading(false);showAlert('error','No se pudieron cargar los datos.');};
  document.body.appendChild(script);
  setTimeout(function(){if(document.getElementById('loading').classList.contains('visible')){setLoading(false);showAlert('error','Tiempo de espera agotado.');}},12000);
}
function receiveData(data) {
  setLoading(false);
  if(!data||data.length===0){document.getElementById('empty').classList.add('visible');return;}
  document.getElementById('empty').classList.remove('visible');
  evaluaciones=data.map((row,i)=>({rowIndex:i+2,timestamp:row.Timestamp||'',grupo:row.Grupo||'',evaluador:row.Evaluador||'',fecha:row.Fecha||'',notaFinal:parseFloat(row.NotaFinal)||0}));
  renderTable();
}
function renderTable() {
  const tbody=document.getElementById('eval-body'); tbody.innerHTML='';
  evaluaciones.forEach((ev,idx)=>{
    const notaClass=ev.notaFinal>=6.5?'nota-hi':ev.notaFinal>=5.5?'nota-ok':ev.notaFinal>=4.5?'nota-mid':'nota-low';
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+(idx+1)+'</td><td><strong>'+esc(ev.grupo)+'</strong></td><td>'+esc(ev.evaluador)+'</td><td>'+esc(ev.fecha)+'</td><td style="text-align:center"><span class="nota-chip '+notaClass+'">'+ev.notaFinal.toFixed(1)+'</span></td><td style="text-align:center"><button class="btn btn-edit" onclick="editarEval('+idx+')">✏️ Editar</button><button class="btn btn-delete" onclick="confirmarEliminar('+idx+')">🗑️ Eliminar</button></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('eval-table').classList.add('visible');
}
function editarEval(idx) {
  const ev=evaluaciones[idx];
  const params=new URLSearchParams({rowIndex:ev.rowIndex,grupo:ev.grupo,evaluador:ev.evaluador,fecha:ev.fecha,modo:'editar'});
  window.location.href='index.html?'+params.toString();
}
function confirmarEliminar(idx) {
  const ev=evaluaciones[idx];
  if(!confirm('¿Eliminar la evaluación de "'+ev.evaluador+'" para "'+ev.grupo+'"?')) return;
  eliminarEval(idx);
}
async function eliminarEval(idx) {
  const ev=evaluaciones[idx];
  showAlert('info','🗑️ Eliminando...');
  try{
    const resp=await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'delete',rowIndex:ev.rowIndex})});
    showAlert('success','✓ Evaluación eliminada correctamente.');
    setTimeout(()=>location.reload(),1500);
  }catch(err){showAlert('error','✗ No se pudo eliminar. Intenta nuevamente.');}
}
function showAlert(type,text){const el=document.getElementById('alert-msg'); el.className='alert visible '+type; el.textContent=text; window.scrollTo(0,0);}
function setLoading(on){document.getElementById('loading').classList.toggle('visible',on);}
function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
loadData();
</script>
</body>
</html>
